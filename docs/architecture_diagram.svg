  <text x="540" y="368" font-size="11" fill="#5F5E5A">• Portfolio summary</text>

  <text x="760" y="270" font-size="12" font-weight="500" fill="#2C2C2A">DQ Checks</text>
  <text x="760" y="288" font-size="11" fill="#5F5E5A">• Null audit</text>
  <text x="760" y="304" font-size="11" fill="#5F5E5A">• Duplicate detection</text>
  <text x="760" y="320" font-size="11" fill="#5F5E5A">• Range validation</text>
  <text x="760" y="336" font-size="11" fill="#5F5E5A">• Categorical domains</text>
  <text x="760" y="352" font-size="11" fill="#5F5E5A">• Cross-layer reconciliation</text>

  <!-- Orchestration bar -->
  <rect x="30" y="385" width="840" height="30" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="450" y="405" text-anchor="middle" font-size="12" font-weight="500" fill="#3C3489">Orchestrated via 05_master_pipeline.py — sequential %run with per-step timing | CI via GitHub Actions</text>
