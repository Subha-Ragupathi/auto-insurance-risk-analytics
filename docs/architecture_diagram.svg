  <line x1="495" y1="130" x2="495" y2="165" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="405" y="170" width="180" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="495" y="196" text-anchor="middle" font-size="13" font-weight="500" fill="#501313">Data Quality Checks</text>
  <text x="495" y="214" text-anchor="middle" font-size="11" fill="#791F1F">6 validation categories</text>

  <!-- Processing details section -->
  <text x="100" y="270" font-size="12" font-weight="500" fill="#2C2C2A">Bronze</text>
  <text x="100" y="288" font-size="11" fill="#5F5E5A">• CSV read with StructType</text>
  <text x="100" y="304" font-size="11" fill="#5F5E5A">• Row-count assertion</text>
  <text x="100" y="320" font-size="11" fill="#5F5E5A">• Delta overwrite</text>

