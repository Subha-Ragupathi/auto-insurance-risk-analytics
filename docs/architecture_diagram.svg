  <rect x="220" y="70" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="295" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">Bronze Delta</text>
  <text x="295" y="114" text-anchor="middle" font-size="11" fill="#185FA5">Explicit schema</text>

  <!-- Arrow -->
  <line x1="370" y1="100" x2="410" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

