  <rect x="620" y="70" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="695" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#412402">Gold Delta</text>
  <text x="695" y="114" text-anchor="middle" font-size="11" fill="#854F0B">7 summary tables</text>

