  <text x="300" y="336" font-size="11" fill="#5F5E5A">• Outlier filtering</text>
  <text x="300" y="352" font-size="11" fill="#5F5E5A">• Domain enforcement</text>

  <text x="540" y="270" font-size="12" font-weight="500" fill="#2C2C2A">Gold</text>
  <text x="540" y="288" font-size="11" fill="#5F5E5A">• Claim rate by region</text>
