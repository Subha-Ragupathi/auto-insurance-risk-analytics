  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#5F5E5A">~58K records</text>

  <!-- Arrow -->
  <line x1="170" y1="100" x2="210" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

