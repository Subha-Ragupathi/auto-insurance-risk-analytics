<svg width="100%" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#2C2C2A">Auto Insurance Risk Analytics — Pipeline Architecture</text>

  <!-- Kaggle Source -->
