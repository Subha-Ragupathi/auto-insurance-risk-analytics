  <text x="495" y="114" text-anchor="middle" font-size="11" fill="#0F6E56">Cleansed + validated</text>

  <!-- Arrow -->
  <line x1="570" y1="100" x2="610" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

